# Sincroniza o JSON fgc/catalog do Secrets Manager (gerado em fgc-infra/env/secrets.tf) como Secret.
# As chaves já estão no formato de env var do ASP.NET Core (Secao__Chave).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fgc-catalog-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: fgc-catalog-api-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fgc/catalog
