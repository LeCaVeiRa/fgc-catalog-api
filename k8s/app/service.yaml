# ClusterIP: tráfego externo entra só pelo Kong (ALB -> Kong -> fgc-catalog-api:8080).
apiVersion: v1
kind: Service
metadata:
  name: fgc-catalog-api
  labels:
    app: fgc-catalog-api
spec:
  type: ClusterIP
  selector:
    app: fgc-catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: http
