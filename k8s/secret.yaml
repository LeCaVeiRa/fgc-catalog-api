# Placeholder para desenvolvimento/avaliação do projeto acadêmico.
# Em um ambiente real, estes valores não seriam versionados em texto plano
# (usar kubectl create secret / um cofre de segredos externo).
apiVersion: v1
kind: Secret
metadata:
  name: fgc-catalog-api-secret
  labels:
    app: fgc-catalog-api
type: Opaque
stringData:
  ConnectionStrings__CatalogDb: "Data Source=catalog.db"
  Jwt__Key: "FgcUsers-Auth-JWT-Key-2026-Strong-And-Secure"
  # Credenciais do usuário do broker Amazon MQ (saída do NotificationsBrokerSecret em
  # fgc-notifications-lambda/template.yaml). Placeholder - em produção real, sincronizar via
  # cofre de segredos externo em vez de copiar manualmente.
  RabbitMq__Username: "fgc-lambda-admin"
  RabbitMq__Password: "CHANGE_ME_AMAZON_MQ_PASSWORD"
